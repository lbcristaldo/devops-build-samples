apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: notify-result
spec:
  description: Log final pipeline result status
  params:
    - name: STATUS
      type: string
      description: Pipeline execution status
    - name: COMPONENT
      type: string
      description: Component name being built
    - name: IMAGE
      type: string
      description: Image name built
  steps:
    - name: notify
      image: alpine:latest
      script: |
        #!/bin/sh
        STATUS="$(params.STATUS)"
        COMPONENT="$(params.COMPONENT)"
        IMAGE="$(params.IMAGE)"
        if [ "$STATUS" = "Succeeded" ]; then
          echo "========================================"
          echo "PIPELINE SUCCESS: $COMPONENT"
          echo "Image: $IMAGE deployed successfully"
          echo "========================================"
        else
          echo "========================================"
          echo "PIPELINE FAILED: $COMPONENT"
          echo "Component $COMPONENT failed to build/deploy"
          echo "Check task logs for details"
          echo "========================================"
        fi
